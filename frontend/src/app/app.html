@if (auth.usuario(); as usuario) {
  <header class="barra">
    <span class="marca">Empresa Logística</span>
    <nav>
      <a routerLink="/pedidos" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Pedidos</a>
      <a routerLink="/pedidos/nuevo" routerLinkActive="activo">Nuevo pedido</a>
      <a routerLink="/reportes/ventas-por-cliente" routerLinkActive="activo">Ventas por cliente</a>
    </nav>
    <div class="usuario">
      <span>{{ usuario.name }} <small class="rol">{{ usuario.rol }}</small></span>
      <button type="button" class="btn btn-secundario" (click)="salir()">Salir</button>
    </div>
  </header>
}

<main class="contenido">
  <router-outlet />
</main>
