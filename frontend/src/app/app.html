@if (auth.usuario(); as usuario) {
  <div class="shell">
    <aside class="sidebar">
      <a routerLink="/pedidos" class="brand">
        <span class="brand-logo"><app-icon name="truck" [size]="20" /></span>
        <span class="brand-text">
          <strong>Empresa Logística</strong>
          <small>Gestión de despachos</small>
        </span>
      </a>

      <nav class="nav" aria-label="Principal">
        <span class="nav-title">Operación</span>
        @for (item of menu; track item.ruta) {
          <a
            class="nav-link"
            [routerLink]="item.ruta"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exacta }"
            ariaCurrentWhenActive="page"
          >
            <app-icon [name]="item.icono" />
            <span>{{ item.etiqueta }}</span>
          </a>
        }
      </nav>

      <div class="user">
        <span class="avatar">{{ iniciales() }}</span>
        <span class="user-info">
          <strong>{{ usuario.name }}</strong>
          <small>{{ usuario.rol === 'admin' ? 'Administrador' : 'Operador' }}</small>
        </span>
        <button type="button" class="logout" aria-label="Cerrar sesión" title="Cerrar sesión" (click)="salir()">
          <app-icon name="log-out" />
        </button>
      </div>
    </aside>

    <main class="main">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
