name: empresa-logistica

services:
  angular:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: logistica-angular
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - nginx
    networks:
      - logistica

  nginx:
    image: nginx:1.27-alpine
    container_name: logistica-nginx
    ports:
      - "${BACKEND_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      laravel:
        condition: service_started
        restart: true
    networks:
      - logistica

  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: logistica-laravel
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-logistica}
      DB_USERNAME: ${MYSQL_USER:-logistica}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRANSPORTADORA_URL: ${TRANSPORTADORA_URL:-http://transportadora-mock/v1}
      TRANSPORTADORA_TOKEN: ${TRANSPORTADORA_TOKEN:-token-local}
    volumes:
      - ./backend:/var/www/html
      # vendor/ vive en un volumen de Docker: leerlo desde el disco de Windows hace muy lento cada request
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistica

  transportadora-mock:
    image: nginx:1.27-alpine
    container_name: logistica-transportadora-mock
    volumes:
      - ./docker/transportadora-mock/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - logistica

  mysql:
    image: mysql:8.4
    container_name: logistica-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-logistica}
      MYSQL_USER: ${MYSQL_USER:-logistica}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - logistica

  redis:
    image: redis:7-alpine
    container_name: logistica-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - logistica

networks:
  logistica:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  frontend_node_modules:
  backend_vendor:
